plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

/*
 * =========================================================
 *  AFTER plugins{} — normal Groovy code is allowed
 * =========================================================
 */
import java.util.Properties
import java.io.FileInputStream

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.shifter.driver'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.shifter.driver"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 29
        versionName "1.0.29"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    /*
     * ================= RELEASE SIGNING =================
     */
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField "String", "API_BASE_URL", '"https://dev-api.shifteronline.com/"'
            buildConfigField "String", "RAZORPAY_KEY", '"rzp_test_Rr8n8p41taq6fM"'
        }

        release {
            minifyEnabled false
            buildConfigField "String", "API_BASE_URL", '"' + providers.gradleProperty("productionApiBaseUrl").getOrElse("https://dev-api.shifteronline.com/") + '"'
            buildConfigField "String", "RAZORPAY_KEY", '"' + providers.gradleProperty("razorpayKey").getOrElse("rzp_test_Rr8n8p41taq6fM") + '"'
            shrinkResources false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        // AGP 8.2 can't 16KB-zip-align uncompressed .so files; compressed ones avoid the Play 16KB error
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-firestore:24.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.google.android.gms:play-services-places:17.0.0'
    implementation 'com.google.android.gms:play-services-location:19.0.0'
    implementation 'com.google.android.gms:play-services-maps:18.0.1'
    // SMS User Consent API — one-tap OTP autofill on the OTP screen (SendOTPActivity).
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    implementation 'com.google.firebase:firebase-auth:21.0.6'
    implementation 'com.google.firebase:firebase-messaging:23.3.1'
    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'

    implementation 'com.google.code.gson:gson:2.8.6'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.3.1'
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    implementation 'com.github.badoualy:stepper-indicator:1.0.7'

    implementation 'com.google.android.libraries.places:places:2.6.0'
    implementation 'com.github.nekoloop:Base64Image:0.1.0'

    implementation 'org.greenrobot:eventbus:3.2.0'

    implementation 'com.stripe:stripe-android:14.5.0'
    implementation "com.stripe:stripe-java:19.23.0"

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.google.auth:google-auth-library-oauth2-http:1.18.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    // Node order/dispatch backend — live order:request/dismiss popups,
    // accept/reject, trip status, location ping (see
    // backend/API_INTEGRATION_GUIDE.md). Excludes the bundled org.json,
    // which conflicts with Android's built-in copy.
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    implementation 'com.airbnb.android:lottie:3.4.0'
    implementation "androidx.core:core:1.13.1"
    implementation 'com.razorpay:checkout:1.6.33'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    // CameraX for Live Face Verification (1.4.2 is 16KB page-aligned for Android 15/16)
    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Google ML Kit Face Detection (Google Play Services variant)
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'

    // Play Core In-App Updates — lets the app prompt the driver to update
    // (flexible or immediate, based on the release's Play Console priority)
    // instead of them only finding out via a Play Store notification.
    implementation 'com.google.android.play:app-update:2.1.0'

    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// Never produce a release using a development endpoint or debug signing.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        def productionUrl = providers.gradleProperty('productionApiBaseUrl').getOrElse('https://dev-api.shifteronline.com/')
        if (!(productionUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?\//)) {
            throw new GradleException('Release requires -PproductionApiBaseUrl=https://YOUR_PRODUCTION_HOST/')
        }
        if (!keystorePropertiesFile.exists() || ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !keystoreProperties[it] }) {
            throw new GradleException('Release requires complete key.properties; debug signing is not permitted.')
        }
    }
}
