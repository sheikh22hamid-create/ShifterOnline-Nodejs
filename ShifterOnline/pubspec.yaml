name: goParcel
description: "A new Flutter project."
publish_to: "none"

version: 1.0.20+20

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.3
  intl: ^0.20.2

  # Location packages
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UI packages
  dotted_line: ^3.1.0
  pinput: ^5.0.0
  accordion: ^2.6.0
  dotted_border: ^2.0.0+2
  readmore: ^3.0.0
  flutter_svg: ^2.0.09
  flutter_spinkit: ^5.2.1
  flutter_rating_bar: ^4.0.1
  otp_text_field: ^1.1.3
  lottie: ^3.0.0
  carousel_slider: ^5.0.0

  # Storage
  get_storage: ^2.0.3
  sqflite: ^2.0.0+4
  path:

  # Network & API
  http: ^0.13.6
  fluttertoast: ^8.0.9

  # ✅ RxDart - Compatible version with all packages
  rxdart: ^0.26.0  # Changed from ^0.27.7 to ^0.26.0

  # ✅ Google Places - Compatible versions
  flutter_google_places: ^0.3.0
  flutter_google_places_hoc081098: 1.0.0-nullsafety.1

  google_api_headers: ^1.1.1  # ✅ Changed from 1.6.0 to 1.1.1 (stable)
  # google_places_flutter: ^2.0.9
  google_maps_webservice: ^0.0.20-nullsafety.5
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^1.0.0

  # Media
  image_picker: ^1.1.2
  image: ^4.3.0

  # WebView
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.10.0
  html: ^0.15.4
  http_auth: ^1.0.1

  # Realtime
  socket_io_client: ^3.1.6

  # HTML rendering
  flutter_html: ^3.0.0-beta.2
  flutter_widget_from_html_core: ^0.15.2

  # Utilities
  package_info_plus: ^4.2.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # Notifications
  onesignal_flutter: ^5.1.5
  flutter_local_notifications: ^18.0.1

  # Firebase
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.4
  firebase_messaging: ^15.2.4

  # Auth & OTP
  otp_autofill: ^4.1.0
  sms_autofill: ^2.3.1

  # Payment
  razorpay_flutter: ^1.3.11
  pull_to_refresh: ^2.0.0


  # Phone
  flutter_phone_direct_caller: ^2.1.1

  # State Management
  provider: ^6.1.2

  # Google APIs
  googleapis_auth: ^1.4.1

  # Dev tools
  change_app_package_name: ^1.5.0
  device_info_plus: ^11.3.0
  speech_to_text: ^7.4.0
  app_links: ^7.2.1
  flutter_native_contact_picker: ^0.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# flutter_html 3.0.0 calls an internal `html` package function
# (query_selector.dart's top-level matches()) that html 0.15.7 removed —
# pinned to the last version that still has it so the build doesn't break.
dependency_overrides:
  html: 0.15.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo1.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/destination_map_marker.png
    - assets/driving_pin.png
    - assets/map_pin.png
    - assets/lock1.png
    - assets/lock2.png
    - assets/refresh.png
    - assets/logo1.png
    - assets/whatsapp_logo.png
    - assets/whatsapp_logo.svg

  fonts:
    - family: Gilroy_Medium
      fonts:
        - asset: assets/static/PlusJakartaSans-Medium.ttf
    - family: Gilroy_Bold
      fonts:
        - asset: assets/static/PlusJakartaSans-Bold.ttf
    - family: Gilroy_Regular
      fonts:
        - asset: assets/static/PlusJakartaSans-Regular.ttf
