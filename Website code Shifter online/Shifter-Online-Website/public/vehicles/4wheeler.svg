<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <rect width="200" height="120" rx="16" fill="#FFF7ED"/>
  
  <!-- Wheels -->
  <circle cx="55" cy="85" r="18" fill="#1E293B"/>
  <circle cx="55" cy="85" r="10" fill="#FED7AA"/>
  <circle cx="150" cy="85" r="18" fill="#1E293B"/>
  <circle cx="150" cy="85" r="10" fill="#FED7AA"/>
  
  <!-- Large Cargo Box Bed (Orange / Slate) -->
  <rect x="75" y="30" width="105" height="48" rx="5" fill="#EA580C"/>
  <rect x="79" y="34" width="97" height="40" rx="4" fill="#F97316"/>
  <path d="M100 34 V74 M125 34 V74 M150 34 V74" stroke="#C2410C" stroke-width="2.5"/>
  
  <!-- Cabin Driver Front (Tata Ace Style) -->
  <path d="M20 80 L22 50 C24 36, 42 32, 60 32 L75 32 V80 Z" fill="#0F172A"/>
  <!-- Windshield -->
  <path d="M28 46 C32 38, 48 36, 56 36 L68 36 V58 H26 Z" fill="#BAE6FD" opacity="0.95"/>
  
  <!-- Headlight -->
  <rect x="20" y="62" width="6" height="10" rx="2" fill="#FDE047"/>
  
  <!-- Shifter Logo Badge -->
  <rect x="90" y="48" width="75" height="12" fill="#0F172A" rx="3"/>
  <text x="127" y="57" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">SHIFTER 4W</text>
  
  <text x="100" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#9A3412" text-anchor="middle">4-WHEELER TRUCK / ACE</text>
</svg>
