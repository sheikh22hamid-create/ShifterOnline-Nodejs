<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <!-- Background glow -->
  <rect width="200" height="120" rx="16" fill="#F4F7FC"/>
  <!-- Wheels -->
  <circle cx="50" cy="85" r="18" fill="#1E293B"/>
  <circle cx="50" cy="85" r="10" fill="#94A3B8"/>
  <circle cx="50" cy="85" r="4" fill="#FFFFFF"/>
  
  <circle cx="150" cy="85" r="18" fill="#1E293B"/>
  <circle cx="150" cy="85" r="10" fill="#94A3B8"/>
  <circle cx="150" cy="85" r="4" fill="#FFFFFF"/>
  
  <!-- Bike Frame & Body -->
  <path d="M45 85 L70 55 L110 55 L145 85" stroke="#0F172A" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M70 55 L85 30 L115 30" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M60 70 Q90 60 120 70 L140 85 H50 Z" fill="#F97316"/>
  
  <!-- Seat -->
  <path d="M75 52 C75 48, 105 48, 110 52 Z" fill="#1E293B"/>
  
  <!-- Delivery Box on Back -->
  <rect x="125" y="32" width="38" height="36" rx="4" fill="#0F172A"/>
  <rect x="128" y="35" width="32" height="30" rx="3" fill="#F97316"/>
  <path d="M136 45 H152 M144 38 V52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Handlebars & Headlight -->
  <path d="M55 40 L68 30" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="48" cy="42" r="5" fill="#FBBF24"/>
  
  <!-- Text Label -->
  <text x="100" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">BIKE / 2-WHEELER</text>
</svg>
